      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: avnc/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build debug APK
        working-directory: avnc
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload AVNC TV APK
        uses: actions/upload-artifact@v4
        with:
          name: AVNC-TV
          path: avnc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error